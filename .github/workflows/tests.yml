name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    env:
      # Run the Qt GUI tests without a display
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # No ffmpeg install step: the bundled imageio-ffmpeg binary is used wherever the runner has no ffmpeg
      - name: Install package
        run: python -m pip install -e ".[dev,gui]"

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          fta --help
          fta demo --output-dir demo_output
