name: Release

# Push a tag like v0.2.0 to build the standalone apps + Python packages and publish a GitHub Release.
# "Run workflow" (manual dispatch) or a branch push changing the packaging builds everything as
# downloadable artifacts without releasing.
on:
  push:
    tags: ["v*"]
    # Branch pushes that touch the packaging only build + smoke-test (the release jobs need a tag)
    branches: ["**"]
    paths: ["packaging/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Python sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(PYTHONPATH=src python -c "import frametime_analyzer as f; print(f.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match frametime_analyzer.__version__ ($version)"; exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  standalone:
    name: Standalone app (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          # Oldest supported Ubuntu runner = oldest glibc, so the build runs on more distros
          - os: ubuntu-22.04
            label: linux-x86_64
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt / X11 libraries to bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1

      - name: Build
        run: |
          python -m pip install ".[gui]" pyinstaller
          pyinstaller packaging/frametime_analyzer.spec --noconfirm
          echo "VERSION=$(python -c 'import frametime_analyzer as f; print(f.__version__)')" >> "$GITHUB_ENV"

      - name: Smoke test the packaged app
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="dist/Frametime Analyzer.app/Contents/MacOS"; else BIN="dist/FrametimeAnalyzer"; fi
          "$BIN/fta" --version
          "$BIN/fta" demo --output-dir smoke_output
          test -s smoke_output/synthetic_analyzed.mp4
          FTA_GUI_SMOKE_TEST=1 "$BIN/FrametimeAnalyzer" smoke_output/synthetic_capture.mp4

      - name: Archive
        run: |
          name="FrametimeAnalyzer-${VERSION}-${{ matrix.label }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../release/${name}.zip" FrametimeAnalyzer >/dev/null) ;;
            macOS)   ditto -c -k --keepParent "dist/Frametime Analyzer.app" "release/${name}.zip" ;;
            Linux)   tar -czf "release/${name}.tar.gz" -C dist FrametimeAnalyzer ;;
          esac
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.label }}
          path: release/*

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  pypi:
    name: Publish to PyPI
    # Opt-in: set the repository variable PUBLISH_TO_PYPI=true after configuring PyPI trusted publishing
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [python-package, standalone]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
