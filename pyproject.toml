[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frametime-analyzer"
dynamic = ["version"]
description = "Professional Video Performance, Frametime, Tearing & Internal Render Resolution Analyzer for Elgato 4K S & UVC Capture Devices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Mathias Debrun"}
]
keywords = ["frametime", "fps", "screen tearing", "resolution", "dynamic resolution", "elgato", "capture", "digital foundry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Display",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    "av>=11.0.0",
    "imageio-ffmpeg>=0.4.9",
    "Pillow>=10.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/mathiasdbo/Frametime-analyzer-tool"
Issues = "https://github.com/mathiasdbo/Frametime-analyzer-tool/issues"
Releases = "https://github.com/mathiasdbo/Frametime-analyzer-tool/releases"

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]

[project.scripts]
fta = "frametime_analyzer.cli.cli:app"

[project.gui-scripts]
fta-gui = "frametime_analyzer.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "frametime_analyzer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"frametime_analyzer.ui" = ["static/**/*"]
